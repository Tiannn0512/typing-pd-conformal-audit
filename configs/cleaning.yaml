    item: "OE 精确重复事件行（participating=2,063 / redundant=1,203，占 keep 行 0.27%）是否去重"
    status: "**定案（2026-09-26 批准）：保留原样（不去重）** + 论文 limitations 披露。
             理由：占比 0.27% 且此时去重属结果后决策；保留为唯一不受结果左右的选项。"
    deadline: "已定案（原 deadline W4 前提前完成）"
