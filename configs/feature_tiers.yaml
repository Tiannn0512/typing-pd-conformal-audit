           9,662,212 行）——与冻结 digraph_pool 定义及 'L2 = L1 +' 语义一致；修复复发猎杀 B/MEDIUM-2
           的未登记口径缺口（keep 池与 L1 基差 34-37% 事件）。同时 FEATURE-DEF-1 的 L3 双手检查
           修复落地（char_from 与 char_to 双方 ∈ {L,R}）；映射表升 v1.0.1（X11 keysym 别名 +
           OE 空格变体归 unassigned）。三项均用户批准（2026-09-26）；L2/L3 方向矩阵与
           tappy2mit 主结果数字相应更新，判定结论不变"
