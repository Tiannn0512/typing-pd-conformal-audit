# feature_tiers.yaml — 三档特征体系冻结配置（TODO-1.4，2026-09-25）
# 依据：研究计划书 v1.3.2 §4.2 + 分析冻结协议 v1 §2（Feature 冻结）
# 效力：本文件为特征档位的唯一权威口径；跨库降档规则由 run_transfer 按 min(源,目标) 执行

tiers:
  L1:
    description: hold/flight/latency 三信号无条件统计
    features: [hold, flight, latency]
    stats: [mean, median, sd, p10, p90]
  L2:
    description: L1 + 手别条件特征（协议 §2 冻结口径为左右手分层；空格层处理规则须随 W4 预注册写明——Tappy direction 含 S 层物理上绕不开）
    features: [hold, flight, latency, hand_conditional]
    stats: [mean, median, sd, p10, p90]
  L3:
    description: L2 + 字符二连键特征（char_from→char_to 聚合）
    features: [hold, flight, latency, hand_conditional, char_digraph]
    stats: [mean, median, sd, p10, p90]

# 每库可用档位上限
# typd=1 的机器验证依据：src/data/validate_schema.py --all 断言 typd_events.parquet
# 无 hand*/char*/key 列（2026-09-25 实测通过，见 data/interim/parse_reports/schema_validation.json）
# ✅ MIT/OE 的手别口径已冻结（2026-09-26）：configs/key_hand_mapping.yaml v1.0.1
#   （标准指法分区；空格/特殊键不硬归属；OE 上档按基准键；不可映射剔除计数）——
#   版本化附件入 W4 预注册；L2 层自冻结起可产出分析数字（先冻结后产出，用户指令）
dataset_max_tier:
  mit: 3     # 冻结协议 §2 转录；L2/L3 口径已冻结（key_hand_mapping.yaml v1.0.1）
  tappy: 2   # 系统级钩子：原生左右手列，无字符身份（v1.3.2 三信号最小集）——L2 无口径缺口
  typd: 1    # 手机触屏：实测 schema 仅 press/release/pressure，无手别无字符 → L1 上限
  oe: 3      # 冻结协议 §2 转录；L2/L3 口径同 MIT 已冻结（key_hand_mapping.yaml v1.0.1）

# 跨库降档规则（冻结协议 §2：按目标库可用档位自动降档；档位作为覆盖衰减显式协变量记录）
cross_dataset_rule: "tier(pair) = min(max_tier(source), max_tier(target))"

# 压力通道：仅 TyPD 存在，其余库无 → 按协议弃用（可行性报告"协议不齐坑 1"），不进任何档位
pressure_channel: discarded

tier_confirmation:
  typd_l1_ceiling:
    confirmed_by: "validate_schema.py FORBIDDEN_TYPD_PATTERNS 断言"
    confirmed_at: "2026-09-25"
    evidence: "data/interim/parse_reports/schema_validation.json"

# ---------- L2/L3 具体特征定义（FEATURE-DEF-1，2026-09-26 结果产出前登记） ----------
# 依据：手别映射表 v1.0.0 冻结（key_hand_mapping.yaml）；登记先于任何 L2/L3 数字产出
feature_definitions:
  L2_hand_conditional:
    applies: [mit, tappy, oe]
    definition: "hand ∈ {L, R} 分层（S/空格/特殊键/unmatched 剔除并计数）× {hold, latency, flight} mean → 6 列"
    columns: "L2_{hold|latency|flight}_{L|R}_mean"
  L3_digraph_transition:
    applies: [mit, oe]
    definition: "相邻字符对（char_from→char_to）双方均可映射到手时，按转移类型分层：
                 same-hand（L→L / R→R）vs cross-hand（L→R / R→L）——
                 {latency, flight} × {same, cross} mean + cross 占比 → 5 列；
                 一方不可映射的二连对剔除并计数。学理依据：交替手二连序的时延是已知的
                 PD 运动控制标记（低维、无源依赖、映射表推导）"
    columns: "L3_{latency|flight}_{same|cross}_mean + L3_frac_cross"
  unmatched_counting: "每方向构建时报告 excluded_unmatched_events / excluded_unassigned_events 计数（进 QC 与论文）"
