# key_hand_mapping.yml: MIT/OE key-to-hand mapping table
# Scope: MIT (key names are the quoted official forms; quotes are stripped at parse time and the pre-lowercase
#        form is kept (see the normalize rules)) and OE (key column lowercase). Tappy uses its native hand
#        columns (not this table); TyPD has no L2.

scheme: "standard US QWERTY touch-typing finger zones"

normalize_rules:
  case: "key names are matched after lowercasing (OE is natively lowercase; MIT is lowered after quote stripping)"
  shifted_rule: "OE shifted printable characters are mapped back to their US QWERTY base key, then assigned the
                 base key's hand (e.g. '!' -> '1' -> L-pinky; '?' -> '/' -> R-pinky; '{' -> '[' -> R-pinky)"
  unmatched_rule: "unmappable keys -> hand = NA, dropped within L2 and counted (unmatched counts are printed at run time)"

hand_zones:
  L:
    pinky: ["`", "1", "q", "a", "z", "tab", "capslock"]
    ring: ["2", "w", "s", "x"]
    middle: ["3", "e", "d", "c"]
    index: ["4", "5", "r", "t", "f", "v", "g", "b"]
  R:
    index: ["6", "7", "y", "u", "h", "j", "n", "m"]
    middle: ["8", "i", "k", ","]
    ring: ["9", "0", "o", "l", "."]
    pinky: ["-", "=", "p", "[", "]", "\\", ";", "'", "/"]

unassigned:  # space/special keys: no forced assignment, dropped within L2 and counted
  - space        # both thumbs, no side
  - enter
  - return
  - backspace
  - shift        # includes shift_l/shift_r/shift_* variants (prefix match on shift)
  - control      # includes control_l/control_r/control_* variants
  - alt          # includes alt_l/alt_r/alt_* variants
  - meta
  - altgr
  - num_lock
  - caps_lock    # same form as capslock
  - left
  - right
  - up
  - down
  - delete
  - insert
  - home
  - end
  - page_up
  - page_down
  - escape
  - mouse        # already filtered by the official autoFilt; kept as a fallback
  - " "          # OE literal space key name
  - ""           # OE empty key name
  - spacebar     # OE variant
  - arrowright   # OE navigation key
  - arrowleft
  - arrowdown
  - arrowup
  - unidentified # OE unidentified event
  - process
  - numlock
  - contextmenu
  - pagedown
  - pageup
  - acute        # X11 dead key (no standard finger zone)
  - "[65105]"    # X11 dead key hex
  - "[65027]"
  - "[65104]"
  - masculine    # ordinal indicator (no base key on US QWERTY)
  - mediaprevioustrack
  - f11
  - f16

shifted_base_map:  # shifted characters -> base key (US QWERTY; the base key is then assigned a hand via hand_zones)
  "~": "`"
  "!": "1"
  "@": "2"
  "#": "3"
  "$": "4"
  "%": "5"
  "^": "6"
  "&": "7"
  "*": "8"
  "(": "9"
  ")": "0"
  "_": "-"
  "+": "="
  "{": "["
  "}": "]"
  "|": "\\"
  ":": ";"
  '"': "'"
  "<": ","
  ">": "."
  "?": "/"
  "A": "a"
  "B": "b"
  "C": "c"
  "D": "d"
  "E": "e"
  "F": "f"
  "G": "g"
  "H": "h"
  "I": "i"
  "J": "j"
  "K": "k"
  "L": "l"
  "M": "m"
  "N": "n"
  "O": "o"
  "P": "p"
  "Q": "q"
  "R": "r"
  "S": "s"
  "T": "t"
  "U": "u"
  "V": "v"
  "W": "w"
  "X": "x"
  "Y": "y"
  "Z": "z"

aliases:  # X11 keysym aliases -> canonical glyph/base key (normalize first, then zones/shifted)
  period: "."
  comma: ","
  colon: ";"
  minus: "-"
  quotedbl: '"'
  question: "?"
  exclam: "!"
  exclamdown: "!"
  ntilde: "n"
  ccedilla: "c"

usage_notes:
  - "L2 features = stratified statistics over hand in {L, R} (space/special/unmatched excluded; exclusions enter the QC counts)"
  - "the S layer (space) does not enter this table's L/R stratification"
  - "MIT's leading Shift_L-style meta keys are already removed by the official autoFilt; this table's unassigned list is a fallback"
  - "match priority: unassigned exact/prefix > aliases normalization > hand_zones exact > shifted_base_map > NA"
